syntax = "proto3";

package selinux.v1;

option go_package = "console-selinux/master/internal/gen/selinuxv1;selinuxv1";

// AgentLink is the single persistent bidirectional channel between an
// agent and the master. One stream per connected agent multiplexes
// heartbeats, AVC events, commands and command acknowledgements.
//
// Named Session rather than Connect: generated clients already expose a
// `connect(dst)` associated function to dial the channel itself, and a
// same-named RPC method collides with it.
service AgentLink {
  rpc Session(stream AgentMessage) returns (stream ServerMessage);
}

// ---- agent -> master ----

message AgentMessage {
  oneof payload {
    EnrollInfo enroll = 1;
    Heartbeat heartbeat = 2;
    AvcEvent avc_event = 3;
    CommandAck ack = 4;
    SelinuxInventory selinux_inventory = 5;
    DenialsChecked denials_checked = 6;
  }
}

// Sent once, as the first message on a newly opened stream.
message EnrollInfo {
  string agent_id = 1;
  string hostname = 2;
  string os_release = 3;
  string kernel_version = 4;
  string agent_version = 5;
}

message Heartbeat {
  string agent_id = 1;
  int64 ts_unix = 2;
  string mode = 3;            // enforcing | permissive | disabled
  string policy_name = 4;     // e.g. targeted
  string policy_version = 5;
}

message AvcEvent {
  string agent_id = 1;
  int64 ts_unix = 2;
  string scontext = 3;
  string tcontext = 4;
  string tclass = 5;
  repeated string perms = 6;
  string comm = 7;
  string path = 8;
  string pid = 9;
  string raw_line = 10;
}

message CommandAck {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

message SelinuxBoolean {
  string name = 1;
  bool value = 2;
}

message SelinuxModule {
  string name = 1;
  string version = 2; // empty when the local `semodule -l` doesn't print one
}

// Sent once right after connecting and then periodically (see
// SELINUX_INVENTORY_INTERVAL_SECS): a full snapshot, not a diff, of the
// SELinux state that changes far less often than heartbeats/AVC events —
// booleans and loaded policy modules. Overwrites the previous snapshot on
// the master rather than appending, since only the current state matters
// (there's no need to keep history of every booleans/modules snapshot).
message SelinuxInventory {
  string agent_id = 1;
  int64 ts_unix = 2;
  repeated SelinuxBoolean booleans = 3;
  repeated SelinuxModule modules = 4;
  // sha256 (hex) of each tracked file's content, keyed by absolute path
  // (see agent's selinux_info::TRACKED_FILES) — /etc/selinux/config and
  // the local fcontext customizations file, not the full 6000+-entry
  // built-in file_contexts (that only changes via policy package
  // updates, not manual drift, and hashing all of it every collection
  // interval buys nothing here). The master diffs this against the
  // previous snapshot to catch a manual, untracked change (e.g. someone
  // hand-editing /etc/selinux/config or running semanage fcontext -a
  // outside this tool).
  map<string, string> file_hashes = 5;
  // Distinct SELinux domains (process types) with at least one process
  // running under them right now, from /proc/*/attr/current — the
  // population a "scan every rule on this machine" run can make permissive
  // one at a time (see CollectionScan): a domain nothing runs under
  // produces no denials either way, so it is left out.
  repeated string active_domains = 6;
}

// ---- master -> agent ----

message ServerMessage {
  oneof payload {
    Command command = 1;
    HeartbeatAck heartbeat_ack = 2;
    CheckDenials check_denials = 3;
  }
}

// "Would this denial still be denied right now?" The master asks this
// periodically (and right after a rule is applied) about denials it still
// shows, so that a denial disappears from the dashboard as soon as *any*
// change — a deployed rule, an approved suggestion, or a hand edit on the
// machine — makes the policy allow it. The agent answers from the policy
// actually loaded in the kernel (selinuxfs "access" interface), not by
// guessing from what was applied.
message DenialProbe {
  string id = 1;        // opaque to the agent, echoed back in the verdict
  string scontext = 2;
  string tcontext = 3;
  string tclass = 4;
  repeated string perms = 5;
  // Path of the denied object, if the AVC record had one: if the file has
  // been relabeled since (chcon/restorecon/semanage), its *current* label is
  // what gets evaluated instead of the one in the old denial.
  string path = 6;
}

message CheckDenials {
  repeated DenialProbe probes = 1;
}

message DenialVerdict {
  string id = 1;
  bool allowed = 2;   // true = would no longer be denied
  string detail = 3;  // why not, or what changed; for logs only
}

message DenialsChecked {
  repeated DenialVerdict verdicts = 1;
}

message Command {
  string command_id = 1;
  CommandType type = 2;
  string payload_json = 3;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SET_MODE = 1;      // payload: {"mode":"enforcing|permissive"}
  COMMAND_TYPE_SET_BOOLEAN = 2;   // payload: {"name":"...","value":true}
  COMMAND_TYPE_INSTALL_MODULE = 3; // payload: {"name":"...","content_base64":"..."}
  // payload: {"path":"...","type":"httpd_sys_content_t","recursive":false}
  // or       {"path":"...","context":"system_u:object_r:httpd_sys_content_t:s0","recursive":false}
  // "context" (full context) wins if both are set.
  COMMAND_TYPE_CHCON = 4;
  // Generation only — never installs anything (that still only ever
  // happens via a separate, explicit COMMAND_TYPE_INSTALL_MODULE once a
  // human approves the suggestion). Runs `audit2allow -M` locally against
  // the given raw audit lines and returns the result via CommandAck's
  // `message` field, JSON-encoded as {"te":"...","pp_base64":"..."}.
  // payload: {"raw_lines":["type=AVC msg=audit(...): ..."],"module_name":"..."}
  COMMAND_TYPE_SUGGEST_MODULE = 5;
  // The two below only ever come from an operator explicitly deleting an
  // applied rule in the dashboard (master/internal/server/revert.go), to
  // undo an INSTALL_MODULE / CHCON on the machine itself.
  // Runs `semodule -r <name>`. payload: {"name":"..."}
  COMMAND_TYPE_REMOVE_MODULE = 6;
  // Runs `restorecon -v [-R] -- <path>`, i.e. resets the path to the
  // policy's default context. payload: {"path":"/abs/path","recursive":false}
  COMMAND_TYPE_RESTORECON = 7;
  // Temporary "collect every denial of this domain" mode: `semanage
  // permissive -a <domain>` so the domain's denials are logged but no
  // longer blocked, revealing all of them at once instead of one per fix.
  // The agent removes it again on its own after duration_secs (kept in a
  // file, so it survives an agent restart and never depends on the master
  // being alive to undo it). A domain that was ALREADY permissive is left
  // untouched, start and stop alike.
  // payload: {"domain":"syslogd_t","duration_secs":600}
  COMMAND_TYPE_PERMISSIVE_START = 8;
  // Ends the mode early / on schedule: `semanage permissive -d <domain>`
  // (idempotent: already gone counts as success).
  // payload: {"domain":"syslogd_t"}
  COMMAND_TYPE_PERMISSIVE_STOP = 9;
}

message HeartbeatAck {
  int64 server_ts_unix = 1;
}
