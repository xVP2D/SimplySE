name: console-selinux

services:
  nats:
    image: nats:2.10-alpine
    # -sd pins the JetStream file store to the mounted volume below;
    # without it, buffered/unacked events wouldn't survive the container
    # being recreated (as opposed to merely restarted) after a crash.
    command: ["-js", "-sd", "/data/jetstream"]
    restart: unless-stopped
    ports:
      # Bound to localhost only: NATS has no auth configured, and only the
      # master (on the same host) needs to reach it — never expose this
      # beyond the host, regardless of what the surrounding firewall allows.
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data/jetstream

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: selinux
      # Dev-only fallback for `make infra-up`; scripts/install-master.sh
      # always generates and passes a real random one instead — never
      # commit a real value here.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-selinux}"
      POSTGRES_DB: selinux
    ports:
      # Bound to localhost only: only the master (same host) should ever
      # reach Postgres directly. Overridable port, still localhost-only
      # (e.g. POSTGRES_HOST_PORT=5433 docker compose up -d).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      # 1.5G is sized for this project's own small lab VM (~5.6G total RAM
      # shared with Postgres/NATS/the master) — enough to comfortably beat
      # the previous 512M default without starving everything else on the
      # box. On a dedicated/bigger node handling real fleet volume, raise
      # OPENSEARCH_HEAP_SIZE instead of editing this file: OpenSearch's own
      # sizing rule is heap = ~50% of the node's RAM, capped at ~32G (past
      # that the JVM loses compressed-oops and more heap stops helping).
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP_SIZE:-1536m} -Xmx${OPENSEARCH_HEAP_SIZE:-1536m}"
      # Required by the image's setup script even with the security plugin
      # disabled (OpenSearch >= 2.12); irrelevant to actual access control
      # here since that plugin is off. Dev-only fallback for `make
      # infra-up`; scripts/install-master.sh always generates a real
      # random one instead.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Console-SELinux-Dev-1!}"
    ports:
      # Bound to localhost only: the security plugin is disabled (see
      # above), so this must never be reachable beyond the host.
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

volumes:
  pgdata:
  osdata:
  natsdata:
